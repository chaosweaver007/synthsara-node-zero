name: Android Launcher

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-launcher.yml"
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/android-launcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
          cache-provider: basic

      - name: Verify privacy contract
        working-directory: android
        run: python3 scripts/verify_privacy_contract.py

      - name: Lint and assemble debug APK
        working-directory: android
        run: gradle :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: synthsara-launcher-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
