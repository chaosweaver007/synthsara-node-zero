name: Diamond Flame Conformance

on:
  push:
    paths:
      - "trial-chamber/**"
      - ".github/workflows/diamond-flame-conformance.yml"
  pull_request:
    paths:
      - "trial-chamber/**"
      - ".github/workflows/diamond-flame-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial-chamber:
    name: Run twelve constitutional hard-gate trials
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Execute Diamond Flame Conformance Suite
        run: |
          node trial-chamber/runner.mjs \
            --adapter ./trial-chamber/adapters/reference.mjs \
            --suite ./trial-chamber/suite.json \
            --output ./trial-chamber/output/witness-ledger.jsonl

      - name: Upload Witness Ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-flame-witness-ledger
          path: trial-chamber/output/witness-ledger.jsonl
          if-no-files-found: error
          retention-days: 30
